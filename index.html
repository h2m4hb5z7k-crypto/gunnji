<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Constant Code Blocks</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:radial-gradient(ellipse,#454747,#181a1a);color:#ddd;font-family:system-ui;user-select:none}main{width:min(96vw,900px);text-align:center}.phone{position:relative;background:#303030;border-radius:7% / 14%;padding:2% 10.7% 2.4%;box-shadow:0 10px 35px #0008;}.phone:before,.phone:after{content:'';position:absolute;top:31%;height:36%;width:1.5%;border-radius:20px;background:#202020}.phone:before{left:3.4%}.phone:after{right:3.4%}.camera{position:absolute;left:3.2%;top:77%;width:1.6%;aspect-ratio:1;border-radius:50%;background:#222}.screen{position:relative;aspect-ratio:1.8;background:#020202;border:1px solid #505353;overflow:hidden;color:#e17e61;font-family:monospace;font-weight:900;container-type:inline-size}.screen:after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,#ffffff0c 0 35%,transparent 35%);pointer-events:none}.head{display:grid;grid-template-columns:5fr 8fr 5fr;height:10%;font-size:3.3cqw;align-items:stretch}.head>div{display:flex;align-items:center;justify-content:center;letter-spacing:.08em}.target{background:#d8e9ce;color:#ab6653;letter-spacing:.35em!important;padding-left:.35em}.target.waiting{background:#333;color:#a77b6d}.target.done{background:transparent;color:transparent}.grid{height:90%;display:grid;grid-template-columns:repeat(18,1fr);grid-template-rows:repeat(9,1fr);touch-action:none}.cell{border:1px solid #505a59;border-right:0;border-bottom:0;display:grid;place-items:center;font-size:3.35cqw;line-height:1;cursor:pointer;text-shadow:0 0 3px #c95c42}.cell.selected{background:#d8e9ce;color:#805343;text-shadow:none}.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#020202;z-index:2;gap:8px;font-size:4cqw}.overlay small{font-size:2.25cqw}.overlay[hidden]{display:none}.controls{margin-top:20px;display:flex;justify-content:center;gap:12px}button{font:inherit;color:#eee;background:#333;border:1px solid #666;border-radius:7px;padding:10px 22px;cursor:pointer}button:hover{background:#484848}p{font-size:13px;color:#b9b9b9;margin:12px 0 0}@media(max-width:600px){.cell{border-width:.5px}.phone{padding-left:8%;padding-right:8%}button{padding:8px 15px}}
.overlay.win #message{font-size:10cqw;color:#a8f5a3;text-shadow:0 0 16px #52d65f88;letter-spacing:.12em}.overlay.win small{color:#a8f5a3}</style></head><body><main><div class="phone"><i class="camera"></i><div class="screen"><div class="head"><div id="t0" class="target"></div><div id="timer">60.00s</div><div id="t1" class="target"></div></div><div id="grid" class="grid"></div><div id="overlay" class="overlay"><div id="message">Starting Hack...</div><small id="subtitle">Find the constant code blocks</small><button id="inside" style="font-size:2.8cqw">START</button></div></div></div><div class="controls"><button id="restart">スタート / リスタート</button><button id="full">全画面</button></div><p>左のコード → 右のコードの順に決定。十字キーで移動、Enterで決定。スマホはタップで選択・決定。</p></main><script>
const $=id=>document.getElementById(id), chars='0123456789ABCDEF',rand=n=>Math.floor(Math.random()*n),letter=()=>chars[rand(16)], code=()=>Array.from({length:5},letter).join('');let cells=[],targets=[],found=[],state='idle',deadline=0,shuffle=0,clock=0,intro=0,hover=-1;for(let i=0;i<162;i++){let el=document.createElement('div');el.className='cell';el.textContent=letter();el.dataset.i=i;$('grid').append(el);cells.push(el)}function start(){clearInterval(shuffle);clearInterval(clock);clearTimeout(intro);state='intro';$('overlay').classList.remove('win');$('subtitle').textContent='Find the constant code blocks';$('overlay').hidden=false;$('inside').hidden=true;$('message').textContent='Starting Hack...';$('timer').textContent='60.00s';hover=-1;intro=setTimeout(begin,3000)}function begin(){targets=[];for(let k=0;k<2;k++){let r,c;do{r=rand(9);c=rand(14)}while(targets.some(t=>t.r===r&&Math.abs(t.c-c)<5));let s;do{s=code()}while(targets.some(t=>t.s===s));targets.push({r,c,s});$('t'+k).textContent=s;$('t'+k).classList.remove('done')}found=[false,false];$('t0').classList.remove('waiting');$('t1').classList.add('waiting');state='play';hover=0;$('overlay').hidden=true;deadline=performance.now()+60000;refresh();shuffle=setInterval(refresh,145);clock=setInterval(()=>{let t=Math.max(0,deadline-performance.now());$('timer').textContent=(t/1000).toFixed(2)+'s';if(!t)finish(false)},20)}function paint(){cells.forEach((e,i)=>{let r=Math.floor(i/18),c=i%18;let fixed=targets.some((t,k)=>found[k]&&t.r===r&&c>=t.c&&c<t.c+5);let h=hover>=0&&Math.floor(hover/18)===r&&c>=hover%18&&c<hover%18+5;e.classList.toggle('selected',fixed||h)})}function refresh(){let board=Array.from({length:162},letter);targets.forEach(t=>{for(let j=0;j<5;j++)board[t.r*18+t.c+j]=t.s[j]});for(let r=0;r<9;r++)for(let c=0;c<14;c++){let i=r*18+c;if(targets.some(t=>t.s===board.slice(i,i+5).join('')&&(t.r!==r||t.c!==c))){let free=Array.from({length:5},(_,j)=>i+j).find(p=>!targets.some(t=>Math.floor(p/18)===t.r&&p%18>=t.c&&p%18<t.c+5));if(free!==undefined)board[free]=chars[(chars.indexOf(board[free])+1)%16]}}cells.forEach((e,i)=>e.textContent=board[i]);paint()}function select(i){if(state!=='play')return;let r=Math.floor(i/18),c=i%18;let k=found[0]?1:0; if(found[k]||targets[k].r!==r||targets[k].c!==c)k=-1;if(k>=0){found[k]=true;$('t'+k).classList.add('done');if(k===0)$('t1').classList.remove('waiting');hover=i;paint();if(found.every(Boolean))finish(true)}else{hover=i;paint()}}function finish(ok){state='end';clearInterval(shuffle);clearInterval(clock);hover=-1;paint();$('timer').textContent=ok?'Success':'Failed';$('t0').classList.add('done');$('t1').classList.add('done');if(ok){$('overlay').classList.add('win');$('message').textContent='CLEAR!';$('subtitle').textContent='クリア成功！';$('inside').textContent='もう一度 / Enter';$('inside').hidden=false;$('overlay').hidden=false;}}$('grid').addEventListener('click',e=>{if(state!=='play')return;let i=Number(e.target.dataset.i);if(Number.isInteger(i)){hover=Math.floor(i/18)*18+Math.min(i%18,13);paint();}});$('restart').onclick=start;$('inside').onclick=start;function confirm(){if(state==='play')select(hover);else if(state!=='intro')start()}document.addEventListener('keydown',e=>{if(!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter'].includes(e.key))return;e.preventDefault();if(e.key==='Enter'){if(!e.repeat)confirm();return}if(state!=='play')return;let r=Math.floor(hover/18),c=hover%18;if(e.key==='ArrowUp')r=Math.max(0,r-1);if(e.key==='ArrowDown')r=Math.min(8,r+1);if(e.key==='ArrowLeft')c=Math.max(0,c-1);if(e.key==='ArrowRight')c=Math.min(13,c+1);hover=r*18+c;paint()});const confirmButton=document.createElement('button');confirmButton.textContent='決定 / Enter';confirmButton.onclick=confirm;document.querySelector('.controls').append(confirmButton);$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.().catch(()=>{})};
</script></body></html>
